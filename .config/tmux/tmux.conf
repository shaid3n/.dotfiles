# Terminal
set -g default-terminal "xterm-256color"
set-option -ga terminal-features 'xterm-256color:RGB'
set -sg escape-time 10

# Prefix & navigation
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
set -g mouse

bind -n M-H previous-window
bind -n M-L next-window

bind | split-window -h
bind _ split-window -v

set-window-option -g mode-keys vi
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Sesh
bind-key "k" run-shell "sesh connect \"$(
	sesh list | fzf-tmux -p 55%,60% \
		--no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
		--header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
		--bind 'tab:down,btab:up' \
		--bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list)' \
		--bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t)' \
		--bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c)' \
		--bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z)' \
		--bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
		--bind 'ctrl-d:execute(tmux kill-session -t {})+change-prompt(⚡  )+reload(sesh list)'
)\""

# Status bar
set -g status-interval 15
set -g status-justify left
set -g status-position bottom
set -g status-left-length 200
set -g status-right-length 200
set -g status-style 'bg=default'

# Toggle manually with prefix + \ ; auto-hide when only one window
bind '\' set -g status
if-shell "[[ $(tmux lsw | wc -l) -le 1 ]]" 'set -g status'

set -g status-left "#[fg=#7F8490,bg=default]󰆧 #[fg=#7F8490,bg=default]#S #[fg=#4C4F5A,bg=default]|"

set -g status-right "#[fg=#9fef00]#(ip addr show tun0 >/dev/null 2>&1 && echo '󰆧 ')#[fg=#7F8490]#(ip addr show tun0 2>/dev/null | awk '/inet / {print \"~ \"}' | head -n 1)#[fg=#7F8490]#(ip addr show tun0 2>/dev/null | awk '/inet / {print $2}' | cut -d/ -f1) #[fg=#7F8490]#([ -f /tmp/htb_target ] && echo '󰓾 ')#[fg=#E2E2E3]#([ -f /tmp/htb_target ] && cat /tmp/htb_target) #[fg=#4C4F5A,bg=default]| #[fg=#d91432]#(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null || echo '#[fg=#7F8490,bg=default]󰌪 ')"

set -g window-status-current-format '#[fg=#E2E2E3,bg=default] #I #W'
set -g window-status-format '#[fg=#7F8490,bg=default] #I #W'
set -g window-status-last-style 'fg=white,bg=default'

# Theme
set -g pane-border-style 'fg=#4C4F5A'
set -g pane-active-border-style 'fg=#FFBE89'
set -g message-command-style bg=default,fg=#E2E2E3
set -g message-style bg=default,fg=#E2E2E3
set -g mode-style bg=default,fg=#9ED072

# Plugins & TPM
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Auto-install TPM on first launch
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
